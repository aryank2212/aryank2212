name: vhs
on:
  push:
    paths:
      - '*.tape'
jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: charmbracelet/vhs-action@v2
        with:
          path: 'profile.tape'
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update terminal gif"
          file_pattern: "*.gif"
